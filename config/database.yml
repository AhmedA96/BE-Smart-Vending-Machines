default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>

development:
  primary:
    <<: *default
    database: vndgme_development

  queue:
    <<: *default
    database: vndgme_development_queue
    migrations_paths: db/queue_migrate

staging:
  primary:
    <<: *default
    database: vndgme_staging

  queue:
    <<: *default
    database: vndgme_staging_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: vndgme_test

production:
  primary:
    <<: *default
    database: vndgme_production

  cache:
    <<: *default
    database: vndgme_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: vndgme_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: vndgme_production_cable
    migrations_paths: db/cable_migrate
