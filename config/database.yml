default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USER", ENV.fetch("POSTGRES_USER", "postgres")) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", ENV.fetch("POSTGRES_PASSWORD", "postgres")) %>
  host: <%= ENV.fetch("DATABASE_HOST", ENV.fetch("POSTGRES_HOST", "localhost")) %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: vndgme_development

staging:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "vndgme_staging") %>

test:
  <<: *default
  database: vndgme_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "vndgme_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "vndgme_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "vndgme_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "vndgme_production") %>_cable
    migrations_paths: db/cable_migrate



