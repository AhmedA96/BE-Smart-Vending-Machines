# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  user:
    wrong_password: "The old password you entered is incorrect"
    password_changed_successfully: "Password changed successfully"
    welcome_email:
      subject: "Welcome to our app"
    authentication:
      invalid_login: "Invalid mobile or password"
    wrong_mobile: "Please enter a valid mobile number"
    password_reset:
      wrong_or_expired_code: "Wrong code or code is expired"
      code_sent: "Code sent successfully"
    account_deleted: "Your account has been deleted successfully"

  avo:
    resource_translations:
      machine_category:
        name: Machine Category
        plural: Machine Categories
        fields:
          name: Name
          description: Description

      machine_status:
        name: Machine Status
        plural: Machine Statuses
        fields:
          machine: Machine
          status: Status
          changed_at: Changed At
          notes: Notes

      machine:
        name: Machine
        plural: Machines
        fields:
          machineuuid: Manufacturer ID
          name: Name
          category: Category
          vendor: Vendor
          location_name: Location Name
          latitude: Latitude
          longitude: Longitude
          status: Status
          installed_at: Installation Date
          last_service_date: Last Service Date

      vendor:
        name: Vendor
        plural: Vendors
        fields:
          name: Name
          contact_person: Contact Person
          phone_number: Phone Number
          email: Email
          address: Address
          
  doorkeeper:
    errors:
      invalid_credentials: "The entered credentials are incorrect. Please check your mobile number and password."
  
  verification:
    mobile:
      otp_message: "Your OTP is: %{otp}"

  errors:
    not_found: "%{model} with id %{id} not found"
    password_reset:
      wrong_or_expired_code: "Wrong code or code is expired"
    contact_us:
      creation_failed: "Failed to submit contact request. Please check your inputs and try again."
    too_many_requests: "Too many requests. Please try again later."
    orders:
      required_quantity_is_not_available_in_the_machine: "Required quantity for %{product_name} is not available in the machine"
      exceeds_machine_max_items_limit:
        one: "You can only checkout one item from this machine per order"
        other: "You can only checkout only %{count} items from this machine per order"
      exceeds_variant_max_orderable_quantity: "You can only order up to %{limit} units of %{product_name}"
      variant_not_available_for_machine: "Variant is not available for this machine"
      machine_offline: "Machine is offline and cannot accept new orders"
  active: Active
  inactive: Inactive