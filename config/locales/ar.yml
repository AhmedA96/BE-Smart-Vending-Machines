  errors:
    not_found: "%{model} بالمعرف %{id} غير موجود"
    too_many_requests: "طلبات كثيرة جداً. يرجى الانتظار قليلاً والمحاولة مرة أخرى."
    unauthorized: "ليس لديك صلاحية لتنفيذ هذا الإجراء"
    server_error: "حدث خطأ ما. يرجى المحاولة مرة أخرى لاحقاً."

  # ==============================================================================
  # DOORKEEPER (OAuth)
  # ==============================================================================
  doorkeeper:
    errors:
      invalid_credentials: "بيانات دخول غير صحيحة. يرجى التحقق من رقم الجوال وكلمة المرور."
