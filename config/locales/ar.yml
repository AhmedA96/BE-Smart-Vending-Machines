      body: "توجه إلى %{machine_name} الآن لاستلام مشترياتك. استمتع!"
    
    order_dispensed:
      title: "تم صرف الطلب"
      body: "تم صرف طلبك في %{machine_name}. شكراً لاستخدامك VNDG.ME!"
    
    order_failed:
      title: "مشكلة في الطلب"
      body: "لم نتمكن من إتمام الطلب رقم #%{order_number}. يرجى التواصل مع الدعم للمساعدة."
    
    # إشعارات الماكينة
    # Machine Notifications
    machine_offline:
      title: "الماكينة غير متاحة"
      body: "%{machine_name} غير متصلة حالياً. يرجى اختيار ماكينة قريبة أخرى."
    
    # الإشعارات الترويجية
    # Promotional Notifications
    promotion:
      title: "عرض خاص 🎁"
      body: "%{promotion_text}"

  # ==============================================================================
  # التواصل والدعم
