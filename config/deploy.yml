# ============================================
# KAMAL DEPLOYMENT CONFIGURATION - BASE
# ============================================
# This is the base configuration for Vending System.
# Use environment-specific overrides:
#
#   kamal deploy -c config/deploy.staging.yml      # Staging (local Docker services)
#   kamal deploy -c config/deploy.production.yml   # Production (AWS managed services)
#
# Environment configs extend this base configuration.
# See deploy.staging.yml and deploy.production.yml for how to override values.

# ============================================
# APPLICATION METADATA
# ============================================

service: vndgme
image: vndg-me/backend

# ============================================
# CONTAINER REGISTRY
# ============================================
# GitHub Container Registry (ghcr.io)

registry:
  server: ghcr.io
  username: mahmoudaliibrahim
  password:
    - KAMAL_REGISTRY_PASSWORD  # Set in .kamal/secrets

# ============================================
# SSH CONFIGURATION
# ============================================
# Used for deploying to EC2 instances

ssh:
  user: ubuntu

# ============================================
# DOCKER IMAGE BUILDER
# ============================================
# Build configuration for Docker images
# Optimized for faster builds with caching

builder:
  arch: amd64
  context: .

# ============================================
# ASSET PIPELINE
# ============================================
# Rails assets configuration

asset_path: /rails/public/assets

# ============================================
# CLI ALIASES
# ============================================
# Shorthand commands for common operations
# Usage: kamal <alias>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  migrate: app exec "bin/rails db:migrate"
  seed: app exec "bin/rails db:seed"

# ============================================
# ENVIRONMENT VARIABLES (BASE DEFAULTS)
# ============================================
# These are inherited by all environment configs.
# Override in environment-specific files as needed.

env:
  secret:
    - RAILS_MASTER_KEY          # From .kamal/secrets
    - POSTGRES_PASSWORD         # From .kamal/secrets

  clear:
    # Server configuration
    WEB_CONCURRENCY: 2
    SOLID_QUEUE_IN_PUMA: "false"
    
    # Logging
    RAILS_LOG_TO_STDOUT: "true"

# ============================================
# SERVERS CONFIGURATION
# ============================================
# MUST BE SET IN ENVIRONMENT-SPECIFIC CONFIG
#
# Example for staging (local single server):
#   servers:
#     web:
#       - 3.29.98.60
#
# Example for production (multiple AWS instances):
#   servers:
#     web:
#       - 10.0.2.x
#       - 10.0.3.x

# ============================================
# PROXY / SSL CONFIGURATION
# ============================================
# MUST BE SET IN ENVIRONMENT-SPECIFIC CONFIG
#
# Example:
#   proxy:
#     ssl: true
#     host: api.vndg.me

# ============================================
# ACCESSORY SERVICES
# ============================================
# OPTIONAL: Only for local/staging deployments
# Production uses AWS managed services (RDS, ElastiCache)
#
# Example for staging (local services):
#   accessories:
#     db:
#       image: postgis/postgis:latest
#       host: 3.29.98.60
#       port: 5432
#       ...
#     redis:
#       image: redis:7.0
#       host: 3.29.98.60
#       ...

# ============================================
# PERSISTENT VOLUMES
# ============================================
# OPTIONAL: Only for staging/local deployments
# Production uses S3/R2 for file storage
#
# Example for staging:
#   volumes:
#     - "vndgme_storage:/rails/storage"

# ============================================
# ENVIRONMENT VARIABLES (MUST OVERRIDE)
# ============================================
# The following MUST be set in your environment config:
#
# env:
#   clear:
#     # Application environment
#     RAILS_ENV: staging|production
#     RAILS_LOG_LEVEL: debug|info
#     
#     # Database configuration
#     POSTGRES_HOST: localhost|aws-rds-endpoint
#     POSTGRES_PORT: 5432
#     POSTGRES_DB: vendingdb|vndgme_staging
#     POSTGRES_USER: vndg|vndgme
#     
#     # Redis/Cache configuration
#     REDIS_HOST: localhost|elasticache-endpoint
#     REDIS_PORT: 6379
#     
#     # AWS/Storage configuration (production only)
#     ACTIVE_STORAGE_SERVICE: amazon|cloudflare_r2
#     AWS_S3_BUCKET: bucket-name
#     AWS_S3_REGION: me-central-1

# ============================================
# SEE ALSO
# ============================================
# - config/deploy.staging.yml    - Staging environment
# - config/deploy.production.yml - Production environment
# - .kamal/secrets               - Secrets file (git-ignored)
