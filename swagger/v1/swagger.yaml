---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/users/signup":
    post:
      summary: Register a new user
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: email already taken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: Password@!123
                mobile_number:
                  type: string
                  example: "+201234567890"
              required:
              - email
              - password
              - mobile_number
  "/api/v1/users/login":
    post:
      summary: User login
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: login successful
        '422':
          description: non-existent user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: Password@123
              required:
              - email
              - password
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
