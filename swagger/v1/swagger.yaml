---
openapi: 3.0.1
info:
  title: Vending Machine API V1
  description: API for vending machine management and operations
  version: v1

security:
  - BearerAuth: []

paths:
  # Authentication endpoints
  /api/v1/users/signup:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  required:
                    - password
                    - mobile_number
                  properties:
                    name:
                      type: string
                      example: "A ALI"
                    mobile_number:
                      type: string
                      example: "+201000000002"
                    password:
                      type: string
                      format: password
                      minLength: 8
                      example: Password!234
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/login:
    post:
      tags:
        - Authentication
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobile_number
                - password
              properties:
                mobile_number:
                  type: string
                  example: "+201000000002"
                password:
                  type: string
                  example: Password!234
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/auth/google:
    post:
      tags:
        - Authentication
      summary: Google OAuth authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
              properties:
                access_token:
                  type: string
                  example: "google_access_token_here"
      responses:
        '200':
          description: Google authentication successful
        '401':
          description: Unauthorized - Invalid or missing token
        '422':
          description: Authentication failed

  /api/v1/users/auth/apple:
    post:
      tags:
        - Authentication
      summary: Apple OAuth authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity_token
              properties:
                identity_token:
                  type: string
                  example: "apple_identity_token_here"
      responses:
        '200':
          description: Apple authentication successful
        '401':
          description: Unauthorized - Invalid or missing token
        '422':
          description: Authentication failed

  # OAuth endpoints
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Generate or refresh access token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token]
                  example: password
                mobile_number:
                  type: string
                  example: "+201000000002"
                password:
                  type: string
                  example: Password!234
                refresh_token:
                  type: string
                  example: def50200...
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid credentials or refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing token

  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: Revoke token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: valid_token
      responses:
        '200':
          description: Token revoked successfully
        '401':
          description: Unauthorized - Invalid or missing token

   # --- Users ---
  /api/v1/users/favorites:
    get:
      tags:
        - User
      summary: Get user favorite items
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of favorite items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/v1/users/most_ordered:
    get:
      tags:
        - User
      summary: Get user's most ordered items
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of most ordered items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/v1/users/profile:
    get:
      tags:
        - User
      summary: Get current user profile
      responses:
        '200':
          description: User profile


  /api/v1/users/update_profile:
    put:
      tags:
        - User
    summary: Update current user profile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  name:
                    type: string
                    example: "Tech User"
                  avatar:
                    type: string
                    example: "https://example.com/avatar.png"
                  email:
                    type: string
                    example: "tech@example.com"
                  date_of_birth:
                    type: string
                    format: date
                    example: "1990-01-01"
                  locale:
                    type: string
                    example: "en"
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
            schema:
              $ref: '#/components/schemas/User'


  /api/v1/users/destroy:
    delete:
      tags:
        - User
      summary: Delete current user account
      responses:
        '200':
          description: Account deleted
        '422':
          description: Could not delete account

  # User Favorites endpoints
  /api/v1/users/favorites/{product_id}:
    post:
      tags:
        - User Favorites
      summary: Add item to user favorites
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Item added to favorites successfully
        '401':
          description: Unauthorized
        '404':
          description: User or product not found

    delete:
      tags:
        - User Favorites
      summary: Remove item from user favorites
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Item removed from favorites successfully
        '401':
          description: Unauthorized
        '404':
          description: User or product not found
          
  # Mobile verification endpoints
  /api/v1/mobile_verifications/send_code:
    post:
      tags:
        - Mobile Verification
      summary: Send verification code to mobile number
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobile_number
              properties:
                mobile_number:
                  type: string
                  example: "+201000000002"
      responses:
        '200':
          description: Verification code sent successfully
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: User not found
        '422':
          description: Failed to send verification code

  /api/v1/mobile_verifications/verify_code:
    post:
      tags:
        - Mobile Verification
      summary: Verify mobile verification code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobile_number
                - verification_code
              properties:
                mobile_number:
                  type: string
                  example: "+201000000002"
                verification_code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Code verified successfully
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: User not found
        '422':
          description: Invalid or expired code

  # Machines endpoints
  /api/v1/machines:
    get:
      tags:
        - Machines
      summary: List all machines
      security:
        - BearerAuth: []
      parameters:
        - name: machine_type_id
          in: query
          schema:
            type: integer
          description: Filter by machine type ID
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of machines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Machine'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/machines/nearby:
    get:
      tags:
        - Machines
      summary: Find machines nearby
      security:
        - BearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 30.0444
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 31.2357
        - name: machine_type_id
          in: query
          schema:
            type: integer
          description: Filter by machine type ID
        - name: stocked
          in: query
          schema:
            type: boolean
          description: Filter stocked machines only
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of nearby machines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Machine'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/machines/{id}:
    get:
      tags:
        - Machines
      summary: Get machine details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Machine details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Machine'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Machine not found

  # Machine Categories endpoints
  /api/v1/machine_categories:
    get:
      tags:
        - Machine Categories
      summary: List all machine categories
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
        - name: location_id
          in: query
          required: false
          schema:
            type: integer
            example: 42
          description: Filter machine categories by location ID
      responses:
        '200':
          description: List of machine categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MachineCategory'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/machine_categories/{id}:
    get:
      tags:
        - Machine Categories
      summary: Get machine category details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Machine category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MachineCategory'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Machine category not found

  # Categories endpoints
  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: List all categories
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/categories/with_brands:
    get:
      tags:
        - Categories
      summary: List categories with brands
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories with brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryWithBrands'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Category not found

  # Products endpoints
  /api/v1/products:
    get:
      tags:
        - Products
      summary: List all products for a specific machine
      security:
        - BearerAuth: []
      parameters:
        - name: machine_id
          in: query
          required: true
          schema:
            type: integer
            example: 9
          description: ID of the machine to list products for
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
        - name: q[product_translations_presentation_cont]
          in: query
          schema:
            type: string
          description: Filter by product presentation
        - name: q[product_translations_description_cont]
          in: query
          schema:
            type: string
          description: Filter by product description
        - name: q[brand_id_eq]
          in: query
          schema:
            type: integer
          description: Filter by brand ID
        - name: q[price_for_price_list_gteq]
          in: query
          schema:
            type: number
            format: float
          description: Minimum price
        - name: q[price_for_price_list_lteq]
          in: query
          schema:
            type: number
            format: float
          description: Maximum price
        - name: q[stock_availability]
          in: query
          schema:
            type: integer
          description: Filter by stock availability
        - name: sort_price
          in: query
          schema:
            type: string
          description: Sort order for products
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/products/machine_products:
    get:
      tags:
        - Products
      summary: List products available for a specific machine
      security:
        - BearerAuth: []
      parameters:
        - name: machine_id
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of machine-specific products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get product details
      security:
        - BearerAuth: []
      parameters:
        - name: machine_id
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Product not found

  # Brands endpoints
  /api/v1/brands:
    get:
      tags:
        - Brands
      summary: List all brands
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
        - name: location_id
          in: query
          required: false
          schema:
            type: integer
            example: 42
          description: Filter machine categories by location ID
      responses:
        '200':
          description: List of brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/v1/brands/{id}:
    get:
      tags:
        - Brands
      summary: Get brand details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Brand details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Brand'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Brand not found

  # Cart endpoints
  /api/v1/carts:
    get:
      tags:
        - Cart
      summary: List all carts for the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of carts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

    post:
      tags:
        - Cart
      summary: Create a new empty cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                machine_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Cart created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

  /api/v1/carts/{id}:
    get:
      tags:
        - Cart
      summary: Get cart details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Cart details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '404':
          description: Cart not found

    patch:
      tags:
        - Cart
      summary: Update cart owner
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Cart owner updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '404':
          description: Cart not found

  /api/v1/carts/{cart_id}/line_items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      security:
        - BearerAuth: []
      parameters:
        - name: cart_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - line_item
              properties:
                line_item:
                  type: object
                  required:
                    - variant_id
                    - quantity
                  properties:
                    variant_id:
                      type: integer
                      example: 1
                    quantity:
                      type: integer
                      example: 2
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '404':
          description: Cart not found

  /api/v1/carts/{cart_id}/line_items/{id}:
    patch:
      tags:
        - Cart
      summary: Update line item in cart
      security:
        - BearerAuth: []
      parameters:
        - name: cart_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - line_item
              properties:
                line_item:
                  type: object
                  required:
                    - quantity
                  properties:
                    quantity:
                      type: integer
                      example: 3
      responses:
        '200':
          description: Line item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '404':
          description: Cart or line item not found

    delete:
      tags:
        - Cart
      summary: Remove line item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: cart_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
