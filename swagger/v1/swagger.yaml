components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authentication token required for all endpoints.
        Accepts either:
        - Public token (for public access)
        - Access token (for authenticated users)
        
        Format: `Bearer <token>`

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        mobile_number:
          type: string
        date_of_birth:
          type: string
          format: date
        verified:
          type: boolean
        sms_notification:
          type: boolean
        email_notification:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 7200
        refresh_token:
          type: string
          example: def50200...
        created_at:
          type: integer
          example: 1710893668

    Machine:
      type: object
      properties:
        id:
          type: integer
        machineuuid:
          type: string
        name:
          type: string
        status:
          type: string
        installed_at:
          type: string
          format: date-time
        last_service_date:
          type: string
          format: date-time
        floor_no:
          type: integer
        location_updated_at:
          type: string
          format: date-time
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              format: float
            longitude:
              type: number
              format: float
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        vendor:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        location:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            address:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MachineCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryWithBrands:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        brands:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        presentation:
          type: string
        status:
          type: string
          enum: [Active, Inactive]
        max_orderable_quantity:
          type: integer
        position:
          type: integer
        total_rate:
          type: number
          format: float
        brand_id:
          type: integer
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              price:
                type: number
                format: float
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: integer
        order_number:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
        total_amount:
          type: number
          format: float
        user_id:
          type: integer
        machine_id:
          type: integer
        cart_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              variant_id:
                type: integer
              quantity:
                type: integer
              price:
                type: number
                format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Variant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          format: float
        product_id:
          type: integer
        stock_quantity:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactUsRequest:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        company_name:
          type: string
        phone_number:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          format: float
        status:
          type: string
          enum: [pending, completed, failed]
        payment_method_id:
          type: integer
        order_id:
          type: integer
        transaction_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              format: float
            longitude:
              type: number
              format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Wallet:
      type: object
      properties:
        id:
          type: integer
        balance:
          type: number
          format: float
        currency:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total_pages:
              type: integer
            total_count:
              type: integer

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
