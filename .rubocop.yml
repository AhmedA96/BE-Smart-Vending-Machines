inherit_from:
  - .rubocop_todo.yml
  - .rubocop-performance.yml
  - .rubocop-rails.yml

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "lib/tasks/auto_annotate_models.rake"
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4.2

Layout/EndOfLine:
  Enabled: true
Bundler/OrderedGems:
  Enabled: true
  AutoCorrect: true
Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true
Layout/LineLength:
  Enabled: true
  AutoCorrect: true
Layout/SpaceAroundMethodCallOperator:
  Enabled: true
Lint/DeprecatedOpenSSLConstant:
  Enabled: true
Lint/MixedRegexpCaptureTypes:
  Enabled: true
Lint/RaiseException:
  Enabled: true
Lint/StructNewOverride:
  Enabled: true
Metrics/BlockLength:
  Enabled: false
  Exclude:
    - "config/environments/development.rb"
    - "config/routes.rb"
Style/AccessorGrouping:
  Enabled: true
Style/BisectedAttrAccessor:
  Enabled: true
Style/ClassAndModuleChildren:
  Enabled: true
  AutoCorrect: true
Style/Documentation:
  Enabled: false
Style/ExponentialNotation:
  Enabled: true
Style/HashEachMethods:
  Enabled: true
Style/HashTransformKeys:
  Enabled: true
Style/HashTransformValues:
  Enabled: true
Style/RedundantAssignment:
  Enabled: true
Style/RedundantFetchBlock:
  Enabled: true
Style/RedundantRegexpCharacterClass:
  Enabled: true
Style/RedundantRegexpEscape:
  Enabled: true
Style/SlicingWithRange:
  Enabled: true
Lint/RedundantCopDisableDirective:
  Enabled: true
  AutoCorrect: true
Metrics/ClassLength:
  Enabled: true
  Max: 120
Style/SafeNavigationChainLength:
  Enabled: true
  Max: 6
